name: deliver

# Makes the branches abapGit and the READMEs use - standard and rap - from
# main, after the whole CI passed on it:
#
#   1. ci.yaml, all of it: the checks, the BSP build, the e2e tests against
#      abap2UI5 main and the 1.145.0 floor.
#   2. scripts/build-bsp.mjs builds the trees out/standard and out/rap, with
#      the control npm installed from package-lock.json and abap2UI5's BSP
#      tools from its main.
#   3. Per branch one commit
#
#        parent = the main commit
#        tree   = out/<branch>, nothing else
#
#      force-pushed to the branch. So every branch is always exactly one
#      commit ahead of main, and nobody develops on it: a commit made there
#      is gone with the next delivery. The force is by construction - the
#      previous tip (old main + its tree) is never an ancestor of the new
#      one.
#
# It runs on every push to main - a docs-only commit moves the branches too,
# same content, new parent, which keeps the invariant - once a month, because
# abap2UI5's BSP tools move without a change here, and by hand. A new version
# of the control arrives as a change to package-lock.json (dependabot, or a
# maintainer right after a release), and so with a push to main.
#
# It runs on GITHUB_TOKEN; the branches it pushes trigger nothing (filter:
# main). A new branch goes into BRANCHES in build-bsp.mjs and into the loop
# below.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  fan_out:
    needs: ci
    # a fork, or a name this does not match, fans out nothing
    if: github.repository == 'abap2UI5/samples-embed-control'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: deliver
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the BSP tools only - they need nothing but node
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/abap2UI5
          path: .abap2ui5
          sparse-checkout: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run bsp
        env:
          ABAP2UI5_DIR: .abap2ui5

      - name: One commit per branch, on top of main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # the branches build-bsp.mjs builds (BRANCHES there)
          for b in standard rap; do
            out="$PWD/out/$b"
            test -d "$out"

            # the tree of out/<branch> as git stores it, in an index of its
            # own - forced, so no .gitignore of an example drops a file
            index="$RUNNER_TEMP/index-$b"
            rm -f "$index"
            GIT_INDEX_FILE="$index" git --git-dir="$PWD/.git" --work-tree="$out" -C "$out" add --all --force .
            tree=$(GIT_INDEX_FILE="$index" git --git-dir="$PWD/.git" write-tree)

            # Idempotence for re-runs: the tip this run would write is
            # already there. Read the parent from the raw object - the fetch
            # is shallow, so the graft would hide it from rev-parse.
            tip=$(git fetch --quiet --depth 1 origin "$b" 2>/dev/null && git rev-parse FETCH_HEAD || true)
            if [ -n "$tip" ] \
              && [ "$(git rev-parse "$tip^{tree}")" = "$tree" ] \
              && [ "$(git cat-file commit "$tip" | sed -n 's/^parent //p' | head -n 1)" = "$GITHUB_SHA" ]; then
              echo "$b: already one commit ahead of main, skipped"
              continue
            fi

            # The branch commit reuses main's message: the parent link says
            # where the content is tracked, the message says what changed.
            commit=$(git log -1 --format=%B "$GITHUB_SHA" | git commit-tree "$tree" -p "$GITHUB_SHA")
            git push --force --quiet origin "$commit:refs/heads/$b"
            echo "$b: pushed $commit"
          done
